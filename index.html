<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<title>BOCA. · Alejandro Bocanegra · Diseño digital y liderazgo creativo</title>
<meta name="description" content="BOCA. Ideas con intención. Portafolio de Alejandro Bocanegra Campo: diseño, experiencia digital y liderazgo creativo.">
<script>try{if(sessionStorage.getItem("fxs")){document.documentElement.classList.add("fxs");sessionStorage.removeItem("fxs")}}catch(e){}</script>
<style>html.fxs body{visibility:hidden;animation:fxshow 0s 1.5s forwards}@keyframes fxshow{to{visibility:visible}}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--obs:#101010;--char:#292929;--conc:#777777;--silver:#D6D6D3;--ivory:#F4F2EE;--crim:#A51F2B;--sub:#555555;
--hd:"Space Grotesk",system-ui,sans-serif;--tx:"DM Sans",system-ui,sans-serif;--mo:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sf:"Cormorant Garamond",Georgia,serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--obs);color:var(--ivory);font:17px/1.6 var(--tx)}
a{color:inherit}
a:focus-visible,summary:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.w{max-width:72rem;margin:0 auto;padding:0 1.25rem}
.mo{font-family:var(--mo);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:var(--crim);z-index:9}
.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0;border-bottom:1px solid var(--char)}
.top a{text-decoration:none}
.logo{font:700 1.3rem var(--hd)}
.top nav a{margin-left:1.4rem;color:var(--silver)}
.top nav a:hover{color:var(--ivory)}
.hero{padding:clamp(2.5rem,7vw,5rem) 0 3rem}
.big{font:700 clamp(4.8rem,25vw,17rem)/.82 var(--hd);letter-spacing:-.05em;margin:1.5rem 0 0}
.big i{display:inline-block;width:.15em;height:.15em;background:var(--crim);margin-left:.03em}
.tag{font:italic 500 clamp(1.8rem,5vw,3.2rem)/1.1 var(--sf);color:var(--silver);margin:1.25rem 0 0}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5rem;margin-top:3.5rem;align-items:start}
.lead{font:500 clamp(1.4rem,3vw,2rem)/1.3 var(--hd);margin:0;max-width:30rem}
.facts{margin:0;padding:0;list-style:none;border-top:1px solid var(--conc)}
.facts li{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--conc)}
.facts b{font:700 1.15rem var(--hd)}
.facts span{color:var(--silver);font-size:.95rem;text-align:right}
.ab p{color:var(--silver);max-width:32rem;margin:1.1rem 0 0}
.photo{margin-top:2rem;width:100%;max-height:26rem;object-fit:cover;filter:grayscale(.2)}
@media (max-width:48rem){.g2{grid-template-columns:1fr}.top nav a:first-child{margin-left:0}}
.lt{background:var(--ivory);color:var(--obs)}
.lt .sub{color:var(--sub)}
.pos{padding:3.5rem 0}
.pos h2{font:700 clamp(1.9rem,5vw,3.6rem)/1.05 var(--hd);letter-spacing:-.02em;margin:.75rem 0 2rem;max-width:44rem}
.terr{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--obs)}
.terr div{padding:1rem 1rem 0 0}
.terr div+div{border-left:1px solid var(--obs);padding-left:1rem}
.terr b{display:block;font:700 1.15rem var(--hd)}
@media (max-width:40rem){.terr{grid-template-columns:1fr}.terr div+div{border-left:0;border-top:1px solid var(--obs);padding-left:0;margin-top:1rem}}
.cases{padding:3.5rem 0 4rem}
.cases>.w>h2{font:700 clamp(2.4rem,9vw,6rem)/.95 var(--hd);letter-spacing:-.04em;margin:.5rem 0 .5rem}
.case{display:grid;grid-template-columns:4.5rem 1fr 13rem;gap:1.5rem;padding:2rem 0;border-top:2px solid var(--obs)}
.case .n{font:500 1rem var(--mo);color:var(--crim);font-weight:500}
.case h3{font:700 clamp(1.5rem,3.6vw,2.4rem)/1.1 var(--hd);letter-spacing:-.02em;margin:.4rem 0 .8rem}
.case p{margin:0 0 1rem;max-width:34rem}
.cv{position:relative;aspect-ratio:1;background:var(--char);overflow:hidden}
.cv::before{content:"";position:absolute;width:46%;height:46%;background:var(--crim);left:var(--x,10%);top:var(--y,14%)}
.cv::after{content:"";position:absolute;left:0;right:0;top:var(--l,70%);height:2px;background:var(--silver)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.case:nth-child(3n+3) .cv{--x:44%;--y:40%;--l:30%}
.case:nth-child(3n+4) .cv{--x:20%;--y:48%;--l:82%}
details{border-top:1px solid #c9c6bf;padding-top:.7rem;margin-top:.5rem}
summary{cursor:pointer;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:.8rem}
.cols h4{margin:0 0 .4rem}
.cols ul{margin:0;padding:0;list-style:none}
.cols li{padding:.3rem 0;border-bottom:1px solid #d9d6cf;font-size:.95rem}
.cols .out li{color:var(--sub);font-style:italic}
@media (max-width:48rem){.case{grid-template-columns:1fr}.cv{max-width:11rem;order:-1}.cols{grid-template-columns:1fr}}
.btn{display:inline-block;padding:.55rem 1.1rem;border:2px solid currentColor;text-decoration:none;font-weight:600;margin:.8rem .6rem 0 0}
.btn:hover{background:var(--obs);color:var(--ivory)}
.dk .btn:hover{background:var(--ivory);color:var(--obs)}
audio{width:100%;max-width:26rem;margin-top:.6rem}
.cr{padding:4rem 0;border-top:1px solid var(--char)}
.cr h2{font:700 clamp(2rem,6vw,4rem)/1 var(--hd);letter-spacing:-.03em;margin:.5rem 0 1rem}
.cr p{color:var(--silver);max-width:36rem}
.row{display:grid;grid-template-columns:9rem 1fr;gap:.4rem 1.5rem;padding:1rem 0;border-top:1px solid var(--obs)}
.row:last-child{border-bottom:1px solid var(--obs)}
.row b{font-family:var(--hd)}
@media (max-width:40rem){.row{grid-template-columns:1fr}}
.rec{padding:3.5rem 0}
.rec h2{font:700 clamp(1.9rem,5vw,3rem) var(--hd);letter-spacing:-.02em;margin:.5rem 0 1.5rem}
.end{padding:clamp(4rem,10vw,7rem) 0 2rem;border-top:1px solid var(--char)}
.end h2{font:italic 500 clamp(2.2rem,7vw,5rem)/1.05 var(--sf);margin:0 0 2rem;max-width:46rem}
.end .btn{color:var(--ivory)}
footer{padding:2rem 0 2.5rem;color:var(--silver)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<!--
  CÓMO EDITAR: todo el contenido está en "const SITE" y "const PROJECTS" al final del archivo.
  Foto: sube un JPG/WebP (menos de 200 KB) a /img y escribe la ruta en SITE.photo.
  Voz: sube un MP3 corto a /audio y escribe la ruta en "audio" del proyecto.
  Portada de caso: ruta de imagen en "img". Un campo vacío ("") no se muestra.
-->
<div id="bar"></div>
<div class="w">
  <header class="top"><a class="logo" href="#inicio" id="logo"></a>
    <nav class="mo"><a href="#casos">Casos</a><a href="#recorrido">Recorrido</a><a href="#contacto">Contacto</a></nav></header>
</div>
<main id="inicio">
  <section class="hero"><div class="w">
    <div class="mo" id="meta" style="color:var(--silver)"></div>
    <h1 class="big" aria-label="BOCA">BOCA<i aria-hidden="true"></i></h1>
    <p class="tag" id="tag"></p>
    <div class="g2"><div><p class="lead" id="lead"></p><div class="ab" id="about"></div></div><ul class="facts" id="facts"></ul></div>
    <img class="photo" id="photo" alt="Retrato de Alejandro Bocanegra" hidden>
  </div></section>

  <section class="lt pos rv"><div class="w">
    <div class="mo sub">01 · Posicionamiento</div>
    <h2 id="posh"></h2>
    <div class="terr" id="terr"></div>
  </div></section>

  <section class="lt cases" id="casos" style="padding-top:0"><div class="w">
    <div class="mo sub" style="padding-top:1rem">02 · Casos</div>
    <h2>Casos.</h2>
    <p class="sub" id="csub" style="margin:0 0 2rem;max-width:34rem"></p>
    <div id="cases"></div>
  </div></section>

  <section class="cr dk rv" id="creative"><div class="w">
    <div class="mo" style="color:var(--silver)">03 · BOCA / Creative</div>
    <h2 id="ctitle"></h2><p id="ctext"></p><div id="cbtn"></div>
  </div></section>

  <section class="lt rec rv" id="recorrido"><div class="w">
    <div class="mo sub">04 · Recorrido</div><h2>Recorrido.</h2><div id="tl"></div>
  </div></section>

  <section class="end dk rv" id="contacto"><div class="w">
    <div class="mo" style="color:var(--silver)">05 · Contacto</div>
    <h2 id="endh" style="margin-top:.8rem"></h2><div id="links"></div>
  </div></section>
</main>
<footer><div class="w mo" id="foot"></div></footer>
<noscript><p style="padding:1rem">Esta página necesita JavaScript para mostrar el contenido.</p></noscript>

<script>
/* ===== EDITA AQUÍ ===== */
const SITE = {
  short: "BOCA.", name: "Alejandro Bocanegra Campo", city: "Cali, Colombia",
  email: "alejandrodesign1927@gmail.com",
  linkedin: "https://www.linkedin.com/in/alejo-boca/",
  behance: "", cv: "", photo: "",
  meta: "Alejandro Bocanegra · Cali, CO",
  tagline: "Ideas con intención.",
  lead: "Soy Alejandro, diseñador gráfico de Cali. Llevo más de 10 años creando, liderando equipos creativos y aprendiendo cómo se conectan las ideas con las personas.",
  about: [
    "Empecé como diseñador gráfico y fui creciendo hasta liderar el área de diseño de una academia online del sector capilar. Hoy coordino equipos de hasta tres personas (diseño, ilustración, redes y redacción) y trabajo en la plataforma, el contenido y los eventos.",
    "Me gusta entender el problema antes de diseñar la solución. Por eso sumé formación en producto y desarrollo web en Coderhouse y ahora estudio Publicidad y Mercadeo en la Universidad Santiago de Cali, para conectar la creatividad con las personas y con el negocio."
  ],
  facts: [["10+ años","en diseño y comunicación visual"],["Cali, Colombia","presencial, híbrido o remoto"],["Estudiando","Publicidad y Mercadeo · Universidad Santiago de Cali"],["Formación","Product Web y Desarrollo Web · Coderhouse"]],
  posTitle: "Creatividad que piensa. Estrategia que transforma.",
  territories: [
    ["BOCA / Creative","Identidad, dirección de arte, piezas, animación y eventos."],
    ["BOCA / Digital","Plataformas web y LMS, experiencia de usuario y prototipos."],
    ["BOCA / Strategy","Auditoría de producto, análisis de problemas y propuestas."]],
  casesSub: "Pocos casos, explicados con honestidad: en cada uno digo qué hice yo y qué no.",
  creativeTitle: "Más de 10 años de diseño gráfico.",
  creativeText: "Identidad, piezas, animación y material para eventos, incluidos eventos en otros países. Los trabajos completos están en Behance.",
  timeline: [
    ["2026 – hoy","Universidad Santiago de Cali","Publicidad y Mercadeo (primer semestre en curso)."],
    ["2025 – 2026","Coderhouse","Product Web y Desarrollo Web."],
    ["2016 – hoy","MundoBIGcorp","Diseñador gráfico y líder de diseño: equipos de hasta 3 personas, plataforma, contenido, leads y eventos."],
    ["2015 – 2016","Decomadeca","Diseñador 3D con SketchUp: modelos a escala real para cotizar carpintería de proyectos de edificios."],
    ["2012 – 2014","Visual Structure","Diseñador gráfico 2D y 3D: mobiliario comercial, avisos y fachadas."]],
  end: "Más que diseñar: entender, conectar y construir."
};
const PROJECTS = [
 { n:"01", title:"BIG Academy", terr:"BOCA / Digital",
   text:"Una academia online para profesionales del sector capilar, con ≈ 25 cursos y ≈ 1.500 estudiantes en varios países.",
   did:["Experiencia del estudiante","Plataforma en WordPress, Elementor y Tutor LMS","Juegos interactivos para aprender","Piezas y páginas para captar leads"], didnt:[], link:"casos.html#big-academy", linkText:"Ver caso", audio:"", img:"img/big-portada.webp" },
 { n:"02", title:"MB Control", terr:"BOCA / Digital · Strategy",
   text:"Branding y auditoría de una plataforma de gestión para salones de belleza: agenda, clientes, ingresos, gastos, inventarios y metas.",
   did:["Branding","Auditoría del producto","Propuestas de arquitectura","Propuestas de interfaz y de experiencia"], didnt:["Desarrollo del software (lo construyó otra persona)"], link:"", linkText:"Ver caso", audio:"", img:"" },
 { n:"03", title:"MAESPRO", terr:"BOCA / Digital",
   text:"Concepto de app que conecta personas con profesionales de remodelación y servicios del hogar. Validación inicial: 2 entrevistas y una encuesta.",
   did:["Definición del problema","Perfiles de usuario","Recorrido principal","Interfaces y prototipos"], didnt:["Producto desarrollado","Pruebas de usabilidad"], link:"casos.html#maespro", linkText:"Ver caso", audio:"", img:"img/maespro-portada.webp" },
 { n:"04", title:"Mad Men", terr:"BOCA / Digital",
   text:"Sitio web responsive hecho en HTML, Sass y Bootstrap durante mi formación en Coderhouse.",
   did:["Diseño visual","Maquetación responsive","Publicación en GitHub Pages"], didnt:[], link:"https://droalejanu.github.io/mad-men-web-coderhouse/index.html", linkText:"Ver el sitio", audio:"", img:"" }
];
/* ===== FIN DE LO EDITABLE ===== */
const $=i=>document.getElementById(i), li=a=>a.map(x=>`<li>${x}</li>`).join("");
$("logo").textContent=SITE.short; $("meta").textContent=SITE.meta; $("tag").textContent=SITE.tagline; $("lead").textContent=SITE.lead; $("about").innerHTML=SITE.about.map(t=>`<p>${t}</p>`).join("");
$("facts").innerHTML=SITE.facts.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join("");
if(SITE.photo){$("photo").src=SITE.photo;$("photo").hidden=false}
$("posh").textContent=SITE.posTitle;
$("terr").innerHTML=SITE.territories.map(t=>`<div><span class="mo sub">${t[0]}</span><b>${t[1]}</b></div>`).join("");
$("csub").textContent=SITE.casesSub;
$("cases").innerHTML=PROJECTS.map(p=>`<article class="case rv"><div class="n">${p.n} / ${String(PROJECTS.length).padStart(2,"0")}</div><div><div class="mo sub">${p.terr}</div><h3>${p.title}</h3><p>${p.text}</p>
<details><summary>Qué hice y qué no</summary><div class="cols"><div><h4>Mi aporte</h4><ul>${li(p.did)}</ul></div>${p.didnt.length?`<div><h4>Fuera de mi alcance</h4><ul class="out">${li(p.didnt)}</ul></div>`:""}</div></details>
${p.audio?`<audio controls preload="none" src="${p.audio}" aria-label="Explicación en voz de ${p.title}"></audio>`:""}
${p.link?`<a class="btn" href="${p.link}" target="_blank" rel="noopener">${p.linkText}</a>`:""}</div>
<div class="cv">${p.img?`<img src="${p.img}" alt="${p.title}" loading="lazy">`:""}</div></article>`).join("");
$("ctitle").textContent=SITE.creativeTitle; $("ctext").textContent=SITE.creativeText;
if(SITE.behance)$("cbtn").innerHTML=`<a class="btn" href="${SITE.behance}" target="_blank" rel="noopener">Ver mi Behance</a>`;
$("tl").innerHTML=SITE.timeline.map(r=>`<div class="row"><div class="mo sub">${r[0]}</div><div><b>${r[1]}</b><br><span class="sub">${r[2]}</span></div></div>`).join("");
$("endh").textContent=SITE.end;
$("links").innerHTML=`<a class="btn" href="mailto:${SITE.email}">${SITE.email}</a><a class="btn" href="${SITE.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`+(SITE.behance?`<a class="btn" href="${SITE.behance}" target="_blank" rel="noopener">Behance</a>`:"")+(SITE.cv?`<a class="btn" href="${SITE.cv}" target="_blank" rel="noopener">Hoja de vida</a>`:"");
$("foot").textContent="BOCA. · "+SITE.name+" · "+SITE.city;
const bar=$("bar");addEventListener("scroll",()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%"},{passive:true});
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.1});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
<script src="fx.js" defer></script>
